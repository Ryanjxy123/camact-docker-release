name: Diagnose gVisor environment

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Minimal fixture or real production builder with synthetic bind data
        type: choice
        default: minimal
        options: [minimal, production-plan]
      policy:
        description: AppArmor experiment selection; candidate never changes production
        type: choice
        default: both
        options: [both, candidate, baseline]

permissions:
  contents: read

jobs:
  diagnose:
    if: inputs.scope != 'production-plan'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        apparmor: ${{ fromJSON(inputs.policy == 'candidate' && '["camact-gvisor-diagnostic-v1"]' || inputs.policy == 'baseline' && '["docker-default"]' || '["docker-default","camact-gvisor-diagnostic-v1"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scan tracked release source before diagnostics
        run: python3 scripts/scan-release.py --tracked
      - name: Run diagnostic regression contracts
        run: python3 -B -m unittest discover -s tests -p test_gvisor_diagnostics.py -v
      - name: Load bounded experimental AppArmor policy on this disposable runner
        if: matrix.apparmor == 'camact-gvisor-diagnostic-v1'
        run: |
          sudo apparmor_parser --replace scripts/diagnostic/camact-gvisor-diagnostic-v1.profile
          sudo aa-status
      - name: Select unique diagnostic archive
        env:
          PROFILE: ${{ matrix.apparmor }}
        run: |
          day=$(TZ=Asia/Shanghai date +%F)
          echo "DIAGNOSTIC_ARCHIVE=$GITHUB_WORKSPACE/harness/_log/$day/camact-gvisor-v1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PROFILE" >> "$GITHUB_ENV"
      - name: Diagnose host, Docker policy, and nested runsc
        env:
          PROFILE: ${{ matrix.apparmor }}
        run: python3 -B scripts/diagnose-gvisor.py --apparmor-profile "$PROFILE" --output "$DIAGNOSTIC_ARCHIVE"
      - name: Retain sanitized diagnostic report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gvisor-environment-diagnostics-${{ matrix.apparmor }}
          path: |
            ${{ env.DIAGNOSTIC_ARCHIVE }}/report.json
            ${{ env.DIAGNOSTIC_ARCHIVE }}/summary.md
          if-no-files-found: error
          retention-days: 14
      - name: Unload experimental profile after container cleanup
        if: always() && matrix.apparmor == 'camact-gvisor-diagnostic-v1'
        run: sudo apparmor_parser --remove scripts/diagnostic/camact-gvisor-diagnostic-v1.profile
  production-plan:
    if: inputs.scope == 'production-plan'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scan source and run independent diagnostic contracts
        run: |
          python3 -B scripts/scan-release.py --tracked
          python3 -B -m unittest discover -s tests -p test_gvisor_diagnostics.py -v
          python3 -B -m unittest discover -s tests -p 'test_production_plan*.py' -v
      - name: Select unique diagnostic archive
        run: |
          day=$(TZ=Asia/Shanghai date +%F)
          echo "DIAGNOSTIC_ARCHIVE=$GITHUB_WORKSPACE/harness/_log/$day/camact-gvisor-v1-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-production-plan" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build unchanged production Dockerfile for isolated diagnostics
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: camact:gvisor-diagnostic
          build-args: |
            VERSION=0.1.0-rc.1
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load bounded experimental AppArmor policy on this disposable runner
        run: sudo apparmor_parser --replace scripts/diagnostic/camact-gvisor-diagnostic-v1.profile
      - name: Verify real production builder, bind storage and CLI boundaries
        run: python3 -B scripts/diagnostic/production-plan-controller.py --image camact:gvisor-diagnostic --output "$DIAGNOSTIC_ARCHIVE/production-plan"
      - name: Retain sanitized production-plan evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gvisor-production-plan-diagnostics
          path: |
            ${{ env.DIAGNOSTIC_ARCHIVE }}/production-plan/report.json
            ${{ env.DIAGNOSTIC_ARCHIVE }}/production-plan/summary.md
            ${{ env.DIAGNOSTIC_ARCHIVE }}/production-plan/probe-artifacts/
            ${{ env.DIAGNOSTIC_ARCHIVE }}/production-plan/logs/
          if-no-files-found: warn
          retention-days: 14
      - name: Unload experimental profile after container cleanup
        if: always()
        run: sudo apparmor_parser --remove scripts/diagnostic/camact-gvisor-diagnostic-v1.profile
