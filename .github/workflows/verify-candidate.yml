name: Verify the local CamAct candidate
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      publish:
        required: true
        type: boolean
jobs:
  candidate:
    # The caller grants package write access only for an explicit publication.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Scan tracked release source before building
        run: python3 scripts/scan-release.py --tracked
      - name: Validate version and image name
        id: identity
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, re
          version = os.environ['REQUESTED_VERSION'].removeprefix('v')
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[a-zA-Z0-9_.-]+)?', version):
              raise SystemExit('An explicit semver release version is required')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('version=' + version + '\n')
              out.write('image=ghcr.io/' + os.environ['REPOSITORY'].lower() + '\n')
          PY
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build locally before publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: camact:verify
          build-args: |
            VERSION=${{ steps.identity.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Network-disabled offline tests and runtime checks
        run: |
          docker run --rm --network=none --entrypoint python camact:verify -B scripts/run-offline-tests.py
          docker run --rm --network=none --entrypoint python camact:verify -B scripts/check-runtimes.py
      - name: Require Compose and native gVisor integration before publishing
        env:
          CAMACT_IMAGE: camact:verify
          CAMACT_VERIFY_SKIP_BUILD: '1'
          CAMACT_EXPECT_VERSION: ${{ steps.identity.outputs.version }}
          CAMACT_EXPECT_SOURCE_REVISION: ${{ github.sha }}
        run: bash scripts/verify-docker.sh
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: ${{ inputs.publish }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the scanned local candidate
        if: ${{ inputs.publish }}
        env:
          IMAGE: ${{ steps.identity.outputs.image }}
          VERSION: ${{ steps.identity.outputs.version }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          docker tag camact:verify "$IMAGE:$VERSION"
          docker tag camact:verify "$IMAGE:sha-$SOURCE_REVISION"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:sha-$SOURCE_REVISION"
