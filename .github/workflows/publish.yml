name: Verify and optionally publish CamAct
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit image version, e.g. 0.1.0 (never latest)'
        required: true
        type: string
      publish:
        description: 'Push to GHCR after all gates pass; leave false for initial validation'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: ghcr-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ !inputs.publish }}
    uses: ./.github/workflows/verify-candidate.yml
    with:
      version: ${{ inputs.version }}
      publish: false
  publish:
    if: ${{ inputs.publish }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/verify-candidate.yml
    with:
      version: ${{ inputs.version }}
      publish: true
