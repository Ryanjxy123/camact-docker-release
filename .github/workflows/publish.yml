name: Build and publish CamAct
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Explicit image version, e.g. 0.1.0 (never latest)'
        required: true
        type: string
  release:
    types: [published]
permissions:
  contents: read
  packages: write
concurrency:
  group: ghcr-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate version and image name
        id: identity
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os, re
          version = os.environ['REQUESTED_VERSION'].removeprefix('v')
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[a-zA-Z0-9_.-]+)?', version):
              raise SystemExit('An explicit semver release version is required')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('version=' + version + '\n')
              out.write('image=ghcr.io/' + os.environ['REPOSITORY'].lower() + '\n')
          PY
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build locally before publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: camact:verify
          build-args: |
            VERSION=${{ steps.identity.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Credential/context scan and network-disabled tests
        run: |
          python3 scripts/scan-release.py --tracked
          docker run --rm --network=none --entrypoint python camact:verify -B scripts/run-offline-tests.py
          docker run --rm --network=none --entrypoint python camact:verify -B scripts/check-runtimes.py
      - name: Require Compose and native gVisor integration before publishing
        env:
          CAMACT_IMAGE: camact:verify
          CAMACT_VERIFY_SKIP_BUILD: '1'
        run: bash scripts/verify-docker.sh
      - name: Publish explicit version and source tags
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.identity.outputs.image }}:${{ steps.identity.outputs.version }}
            ${{ steps.identity.outputs.image }}:sha-${{ github.sha }}
          build-args: |
            VERSION=${{ steps.identity.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          provenance: mode=max
          sbom: true
